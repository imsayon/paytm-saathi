# pnpm 12 blocks dependency install scripts unless approved here.
# esbuild ships its platform binary through a postinstall; tsx needs it.
allowBuilds:
  core-js: true
  esbuild: true
# The inherited lockfile pins this official SDK release from event day.
# Keep the age check for every other package and future SDK version.
minimumReleaseAgeExclude:
  - openai@7.18.0
