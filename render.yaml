# Render Blueprint for Paytm Saathi.
# Dashboard: New -> Blueprint -> pick this repository; Render reads this file
# and prompts for the three `sync: false` secrets below. Never put real
# connection strings or keys in this file.
services:
  - type: web
    name: paytm-saathi
    runtime: node
    repo: https://github.com/imsayon/paytm-saathi
    branch: main
    # Closest Render region to Bengaluru. Neon's compute is in ap-southeast-1
    # as well, so the app and the database stay in the same part of the world.
    region: singapore
    # `free` spins down after 15 idle minutes and takes ~1 min to wake, which
    # is fine for judging but not for a live stage demo; use `starter` for that.
    # Pre-deploy commands are paid-only, so on `free` the migration runs at the
    # end of the build instead (idempotent and advisory-locked, see
    # src/server/db/migrate.ts).
    plan: free
    # Render detects the pnpm version from package.json's `packageManager`
    # field. Avoid global npm installs because Render's image keeps that path
    # read-only. `--prod=false` keeps TypeScript/tsx for build and migrations.
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm build && pnpm db:migrate
    # The `pnpm start` script binds to 127.0.0.1 on purpose for local demos;
    # Render's port scan needs 0.0.0.0. `next start` reads $PORT on its own.
    startCommand: npx next start --hostname 0.0.0.0
    # Fails closed with 503 until the database answers and every migration is
    # recorded, so a deploy is never marked live against an unmigrated database.
    healthCheckPath: /api/readyz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Production uses Neon Auth and gives each signed-in merchant a private workspace.
      # Keep the preview/demo switch off on the public deployment.
      - key: SAATHI_DEMO_MODE
        value: "false"
      - key: SAATHI_GEMINI_MODEL
        value: gemini-2.5-flash
      # Neon Auth is branchable identity in the same backend as the product DB.
      - key: NEON_AUTH_BASE_URL
        sync: false
      - key: NEON_AUTH_COOKIE_SECRET
        sync: false
      # Paytm-facing canonical REST/webhook adapter shared secret.
      - key: SAATHI_CONNECTOR_API_KEY
        sync: false
      # Neon pooled endpoint (host contains "-pooler"): application traffic.
      - key: DATABASE_URL
        sync: false
      # Neon direct endpoint: migrations, run at the end of the build.
      - key: DATABASE_URL_UNPOOLED
        sync: false
      # Optional. Without it the planner uses the labelled template fallback.
      - key: GEMINI_API_KEY
        sync: false
      # Switch to twilio after adding the account credentials below.
      - key: SAATHI_DELIVERY_PROVIDER
        value: mock
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: TWILIO_SEND_WAIT_MS
        value: "8000"
      - key: TWILIO_TEST_TO
        sync: false
      # Set to the service's public URL so Twilio status callbacks can be verified.
      - key: PUBLIC_BASE_URL
        sync: false
      # Optional signed n8n automation sink. Keep empty to retain Neon-only operation.
      - key: N8N_WEBHOOK_URL
        sync: false
      - key: N8N_WEBHOOK_SECRET
        sync: false
      # Optional Cognee memory mirror. Neon is authoritative if this is absent.
      - key: COGNEE_BASE_URL
        sync: false
      - key: COGNEE_API_KEY
        sync: false
